apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookbug-frontend
  namespace: bookbug
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookbug-frontend
  template:
    metadata:
      labels:
        app: bookbug-frontend
    spec:
      containers:
        - name: frontend
          image: your-dockerhub-username/bookbug-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
