apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bookbee-backend-hpa
  namespace: bookbee
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bookbee-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
