apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookbee-backend
  namespace: bookbee
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookbee-backend
  template:
    metadata:
      labels:
        app: bookbee-backend
    spec:
      containers:
        - name: backend
          image: your-dockerhub-username/bookbee-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
