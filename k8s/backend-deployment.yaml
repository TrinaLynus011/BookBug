apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookbug-backend
  namespace: bookbug
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookbug-backend
  template:
    metadata:
      labels:
        app: bookbug-backend
    spec:
      containers:
        - name: backend
          image: your-dockerhub-username/bookbug-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
