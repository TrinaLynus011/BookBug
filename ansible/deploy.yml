---
# BookBug – Ansible Deployment Playbook
# Usage: ansible-playbook -i inventory.ini deploy.yml
#
# Required variables (pass via -e or vars file):
#   dockerhub_username  – Docker Hub username
#   secret_key          – JWT secret key for the backend

- name: Deploy BookBug application
  hosts: app_servers
  become: true
  vars:
    image_name: "{{ dockerhub_username }}/bookbug-backend:latest"
    container_name: bookbug-backend
    app_port: 8000

  tasks:

    # ── Docker installation ───────────────────────────────────────────────────

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Install Docker CE
      apt:
        name: docker.io
        state: present

    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: true
        state: started

    # ── Image pull ────────────────────────────────────────────────────────────

    - name: Pull latest BookBug backend image
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: pull
        force_source: true

    # ── Container lifecycle ───────────────────────────────────────────────────

    - name: Stop existing container (if running)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Start BookBug backend container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_port }}:{{ app_port }}"
        env:
          SECRET_KEY: "{{ secret_key }}"
        healthcheck:
          test: ["CMD", "python", "-c",
                 "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
          interval: 20s
          timeout: 5s
          retries: 3

    # ── Verification ──────────────────────────────────────────────────────────

    - name: Wait for backend to become healthy
      uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      register: health_check
      retries: 10
      delay: 5
      until: health_check.status == 200

    - name: Print deployment result
      debug:
        msg: "BookBug backend is running at http://{{ ansible_host }}:{{ app_port }}"
