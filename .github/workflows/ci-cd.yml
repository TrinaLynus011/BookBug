name: BookBug CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  BACKEND_IMAGE: bookbug-backend
  FRONTEND_IMAGE: bookbug-frontend

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Backend: lint + test ──────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: flake8 backend tests --max-line-length=120

      - name: Run pytest
        env:
          SECRET_KEY: test-secret-key
          MONGODB_URL: mongodb://localhost:27017
        run: pytest backend/tests -v

  # ── 2. Frontend: lint + test + build ────────────────────────────────────
  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── 3. Docker: build & push both images ─────────────────────────────────
  docker:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only push on real pushes (not PRs), and only when Docker Hub secrets exist
    if: >
      github.event_name == 'push' &&
      secrets.DOCKERHUB_USERNAME != '' &&
      secrets.DOCKERHUB_TOKEN != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Deploy to Kubernetes ──────────────────────────────────────────────
  # This job is intentionally skipped unless a valid remote KUBECONFIG secret
  # is configured in the repository settings.
  # To enable: add a repository secret named KUBECONFIG containing the
  # base64-encoded kubeconfig of your remote cluster (NOT a local minikube config).
  #   Linux/macOS: base64 -w0 ~/.kube/config
  #   Windows:     [Convert]::ToBase64String([IO.File]::ReadAllBytes("$HOME\.kube\config"))
  deploy:
    name: Deploy — Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    # Only run when: on main, it's a push, docker secrets exist, AND a remote
    # KUBECONFIG secret has been explicitly configured.
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      secrets.KUBECONFIG != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          # Try base64-decode first; fall back to raw write
          if printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config" 2>/dev/null; then
            echo "Kubeconfig loaded (base64-decoded)"
          else
            printf '%s' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
            echo "Kubeconfig loaded (raw)"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Validate cluster connectivity
        run: kubectl cluster-info --request-timeout=10s

      - name: Substitute image tags
        run: |
          sed -i \
            "s|your-dockerhub-username/bookbug-backend:latest|${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" \
            k8s/backend-deployment.yaml
          sed -i \
            "s|your-dockerhub-username/bookbug-frontend:latest|${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|g" \
            k8s/frontend-deployment.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/bookbug-backend  -n bookbug --timeout=120s
          kubectl rollout status deployment/bookbug-frontend -n bookbug --timeout=120s
